[package]
name = "human_telemetry"
version = "0.1.0"
edition = "2021"
description = "RecordMouseFULL-HumanTelemetry-AIO: high-fidelity mouse telemetry recorder (Raw Input, QPC-timed, append-only)"
build = "build.rs"

[[bin]]
name = "HumanTelemetry"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_Console",
    "Win32_System_Shutdown",
    "Win32_Graphics_Gdi",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_DeviceAndDriverInstallation",
] }
zstd = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# NOTE: deliberately NOT panic = "abort". A panic on any thread must still run
# the panic hook so the writer can flush buffered events and mark the session
# interrupted. Aborting would discard up to one batch of real data.
